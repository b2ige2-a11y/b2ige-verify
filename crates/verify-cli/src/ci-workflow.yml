name: B2IGE Verify
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      B2IGE_TRUSTED_REVISION: ${{ github.event.pull_request.base.sha }}
      B2IGE_CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: project
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: __REPO__
          ref: '__PIN__'
          path: verifier
          persist-credentials: false
      - name: Build independently pinned verifier only
        working-directory: verifier
        run: |
          test "$(git rev-parse HEAD)" = '__PIN__'
          cargo build --workspace --release --locked
      # Candidate workflows/build hooks/native targets are never executed here.
      # Native Behavior/SideEffect stay blocked pending a reviewed isolated runtime.
      # Separate build provisioning and approval do not isolate target execution.
      - name: Require protected controller inputs (no automatic approval)
        working-directory: project
        run: |
          test "$(git rev-parse HEAD)" = "$B2IGE_TRUSTED_REVISION"
          git diff --exit-code "$B2IGE_TRUSTED_REVISION" -- .
          test -f .b2ige/project.json
          test ! -L .b2ige
          test ! -L .b2ige/project.json
          test ! -e b2ige-agent-reports
          test ! -L b2ige-agent-reports
          test ! -e "$RUNNER_TEMP/b2ige-agent-artifacts"
          test ! -L "$RUNNER_TEMP/b2ige-agent-artifacts"
          test -f "$RUNNER_TEMP/b2ige-candidate-approval.json"
          test ! -L "$RUNNER_TEMP/b2ige-candidate-approval.json"
          "$GITHUB_WORKSPACE/verifier/target/release/b2ige" ci init --identity __IDENTITY__ --provider github-actions --registry .b2ige/project.json --verifier-repo __REPO__ --verifier-ref __PIN__ --root "$RUNNER_TEMP"
      - name: Fetch candidate objects for diff inspection only
        working-directory: project
        run: git fetch --no-tags origin "$B2IGE_CANDIDATE_REVISION"
      - name: Verify all registered contracts (only PASS is green)
        id: verification
        working-directory: project
        env:
          B2IGE_BLINDTEST_SEALED_ROOT: ${{ runner.temp }}/b2ige-sealed
        run: >-
          python3 "$GITHUB_WORKSPACE/verifier/scripts/diff-verify.py"
          --project-root "$GITHUB_WORKSPACE/project"
          --base "$B2IGE_TRUSTED_REVISION"
          --head "$B2IGE_CANDIDATE_REVISION"
          --trusted-revision "$B2IGE_TRUSTED_REVISION"
          --required-registry .b2ige/project.json
          --registry .b2ige/project.json
          --candidate-approval "$RUNNER_TEMP/b2ige-candidate-approval.json"
          --b2ige "$GITHUB_WORKSPACE/verifier/target/release/b2ige"
          --trusted-controller
          --artifact-dir "$RUNNER_TEMP/b2ige-agent-artifacts"
          --report-dir b2ige-agent-reports
          --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.verification.outputs.artifacts_ready == 'true' }}
        with:
          name: b2ige-sanitized-agent-reports
          path: ${{ runner.temp }}/b2ige-agent-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 14
