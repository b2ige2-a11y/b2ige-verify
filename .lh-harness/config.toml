[run]
agent = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "max"
env = "local"
runs_root = "./.lh-harness/runs"
prompt_language = "en"
mcp_add_dirs = []
guard_exclude_paths = ["target"]
max_rounds = 6
dashboard = false
dashboard_port = 0

[run.timeouts]
manager = 240
gui_executor = 1800
cli_executor = 1800
auditor = 300

[run.roles.manager]
agent = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "max"

[run.roles.executor]
agent = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "max"

[run.roles.cli_executor]
agent = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "max"

[run.roles.auditor]
agent = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "max"

[run.roles.cli_auditor]
agent = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "max"

[run.roles.final_response]
agent = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "max"
